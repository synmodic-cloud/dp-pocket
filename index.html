<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>隨身控制台</title>
<style>
:root{--bg:#101820;--panel:#18232e;--line:#2a3846;--ink:#ece4d2;--mute:#8d97a1;--gold:#d9b45b;--green:#4cb97f;--red:#e8675a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"PingFang TC",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
header b{font-size:20px;letter-spacing:.04em}
header span{color:var(--mute);font-size:13px}
header .sp{flex:1}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{width:100%;min-height:84px;resize:vertical;background:transparent;border:0;color:var(--ink);font:inherit;outline:none}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}
.row .hint{color:var(--mute);font-size:12px;flex:1}
button{font:inherit;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;padding:6px 14px}
button.solid{background:var(--gold);color:#141a22;font-weight:600}
button:disabled{opacity:.4}
h2{font-size:13px;color:var(--gold);letter-spacing:.12em;margin:22px 0 8px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li.task{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line)}
li.task .box{flex:none;width:22px;height:22px;border:1.5px solid var(--mute);border-radius:5px;margin-top:2px}
li.task.done .box{background:var(--green);border-color:var(--green)}
li.task.done .t{color:var(--mute);text-decoration:line-through}
li.task .p{display:block;color:var(--mute);font-size:12px}
li.task .late{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card .q{margin:0 0 8px}
.card .a{display:none;margin:8px 0;color:var(--mute)}
.card.open .a{display:block}
.status{margin-top:20px;color:var(--mute);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.setup input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;padding:10px;border-radius:8px;margin:6px 0 12px}
.empty{color:var(--mute);font-size:14px;padding:8px 2px}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
// 隨身控制台 試驗版：快照與待送的動作都存在這支手機上，打開時先畫上次的快照，再在背景更新。
const T0 = performance.now();
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const cfg = () => LS.get('dp.cfg', null);
const snap = () => LS.get('dp.snap', null);
const outbox = () => LS.get('dp.outbox', []);
const local = () => LS.get('dp.local', {}); // 已在手機上做了、快照還沒反映的：{ 'task:path|raw': true, recall: key }
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const hk = (d = new Date()) => new Date(d.getTime() + 8 * 3600e3).toISOString().slice(0, 10);
const hhmm = (iso) => new Date(new Date(iso).getTime() + 8 * 3600e3).toISOString().slice(11, 16);
const id = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
let ready = 0;
let syncing = false;
let lastSync = LS.get('dp.lastSync', null);

function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => el.classList.remove('on'), 1600);
}

function queue(op) {
  const e = { v: 1, id: id(), at: new Date().toISOString(), op };
  LS.set('dp.outbox', [...outbox(), e]);
  sync();
}

async function sync() {
  const c = cfg();
  if (!c || syncing || !navigator.onLine) return draw();
  syncing = true;
  draw();
  try {
    const box = outbox();
    if (box.length) {
      const r = await fetch(c.url, { method: 'POST', body: JSON.stringify({ k: c.key, entries: box }) }).then((r) => r.json());
      if (r.error) throw new Error(r.error);
      const sent = new Set([...(r.done || []), ...(r.refused || [])]);
      LS.set('dp.outbox', outbox().filter((e) => !sent.has(e.id)));
    }
    const s = await fetch(`${c.url}?k=${encodeURIComponent(c.key)}&t=${Date.now()}`).then((r) => r.json());
    if (s.error) throw new Error(s.error);
    const old = snap();
    LS.set('dp.snap', s);
    // 新快照已經反映的，就不必再記在手機上
    if (!old || s.generatedAt !== old.generatedAt) LS.set('dp.local', {});
    lastSync = new Date().toISOString();
    LS.set('dp.lastSync', lastSync);
  } catch (err) {
    toast(`同步沒成功：${err.message || err}`);
  } finally {
    syncing = false;
    draw();
  }
}

function setup() {
  const c = cfg() || { url: '', key: '' };
  $('#app').innerHTML = `
    <header><b>隨身控制台</b><span>第一次設定</span></header>
    <div class="setup">
      <p>貼上 Apps Script 網頁應用程式的網址，和你設在指令碼屬性的 KEY。只存在這支手機上。</p>
      <label>網址<input id="u" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></label>
      <label>密鑰<input id="k" value="${esc(c.key)}" autocapitalize="off" autocorrect="off"></label>
      <button class="solid" id="save">開始</button>
    </div>`;
  $('#save').onclick = () => {
    const url = $('#u').value.trim();
    const key = $('#k').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(url) || !key) return toast('網址或密鑰不對');
    LS.set('dp.cfg', { url, key });
    draw(true);
    sync();
  };
}

function draw(focus) {
  if (!cfg()) return setup();
  const s = snap();
  const mine = local();
  const today = hk();
  const tasks = (s?.tasks || [])
    .filter((t) => !t.done || mine[`task:${t.path}|${t.raw}`])
    .filter((t) => t.main || (t.due && t.due <= today))
    .sort((a, b) => (a.due || '9') < (b.due || '9') ? -1 : 1);
  const rc = s?.recall?.item;
  const rcDone = s?.recall?.done != null || mine.recall === rc?.key;
  const q = s?.daily?.question;
  const pending = outbox().length;
  const draft = $('#cap')?.value ?? LS.get('dp.draft', '');
  // a sync that lands while you type must not take the caret away
  const typing = document.activeElement?.id === 'cap' ? $('#cap').selectionStart : -1;
  $('#app').innerHTML = `
    <header><b>${s ? `${Number(s.date.slice(5, 7))}/${Number(s.date.slice(8))}` : '今天'}</b><span>${s?.game ? `Lv ${s.game.level} · 連續 ${s.game.streak} 天` : ''}</span><span class="sp"></span><span>${syncing ? '同步中…' : pending ? `${pending} 件待送` : ''}</span></header>
    <div class="cap">
      <textarea id="cap" placeholder="隨手記。! 開頭是待辦，? 是問題，= 是詞彙，> 是摘句" enterkeyhint="send">${esc(draft)}</textarea>
      <div class="row"><span class="hint">送出後由 Mac 上的控制台寫進 vault</span><button class="solid" id="send" ${draft.trim() ? '' : 'disabled'}>記下</button></div>
    </div>
    <h2>今天的事</h2>
    <ul>${tasks.length ? tasks.map((t) => {
      const done = t.done || mine[`task:${t.path}|${t.raw}`];
      return `<li class="task ${done ? 'done' : ''}" data-k="${esc(`${t.path}|${t.raw}`)}"><span class="box"></span><span><span class="t">${esc(t.text)}</span><span class="p">${esc(t.place)}${t.due ? ` · <span class="${t.due < today ? 'late' : ''}">${t.due.slice(5).replace('-', '/')}</span>` : ''}</span></span></li>`;
    }).join('') : `<li class="empty">${s ? '今天沒有到期的事。' : '還沒有快照：連上網路後會自動取得。'}</li>`}</ul>
    ${rc ? `<h2>回想</h2><div class="card" id="rc"><p class="q">${esc(rc.skill)} 的${rc.kind === '根' ? '根卡' : esc(rc.kind)}${rc.why ? `<span style="display:block;color:var(--mute);font-size:14px">來由：${esc(rc.why)}</span>` : ''}那一句是甚麼？先在心裏說出來。</p><p class="a">${esc(rc.text)}</p>
      <div class="row">${rcDone ? '<span class="hint">今天答過了</span>' : '<button id="show">揭曉</button><span class="sp"></span><button data-ok="1" hidden>對</button><button data-ok="0" hidden>錯</button>'}</div></div>` : ''}
    ${q?.text ? `<h2>一問</h2><div class="card"><p class="q">${esc(q.text)}</p>${q.answer ? `<p class="hint" style="color:var(--mute);font-size:14px;margin:0;white-space:pre-wrap">${esc(q.answer)}</p>` : ''}</div>` : ''}
    <div class="status">
      <span>快照 ${s ? `${s.date.slice(5)} ${hhmm(s.generatedAt)}` : '—'}</span>
      <span>上次同步 ${lastSync ? hhmm(lastSync) : '—'}</span>
      <span>開到能打字 ${ready ? `${Math.round(ready)} ms` : '…'}</span>
      <a href="#" id="cfg" style="color:var(--mute)">設定</a>
    </div>`;
  const cap = $('#cap');
  const send = () => {
    const raw = cap.value.trim();
    if (!raw) return;
    // cleared first: queue() redraws, and the redraw keeps whatever is still in the box
    cap.value = '';
    LS.set('dp.draft', '');
    queue({ type: 'capture', raw, via: '寫', field: null });
    toast('記下了');
  };
  cap.oninput = () => {
    LS.set('dp.draft', cap.value);
    $('#send').disabled = !cap.value.trim();
  };
  cap.onkeydown = (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send();
  };
  $('#send').onclick = send;
  for (const li of document.querySelectorAll('li.task[data-k]'))
    li.onclick = () => {
      if (li.classList.contains('done')) return;
      const [path, ...rest] = li.dataset.k.split('|');
      const raw = rest.join('|');
      LS.set('dp.local', { ...local(), [`task:${path}|${raw}`]: true });
      queue({ type: 'task', path, raw, done: true });
      toast('完成');
    };
  const show = $('#show');
  if (show)
    show.onclick = () => {
      $('#rc').classList.add('open');
      show.hidden = true;
      for (const b of document.querySelectorAll('#rc [data-ok]')) {
        b.hidden = false;
        b.onclick = () => {
          LS.set('dp.local', { ...local(), recall: rc.key });
          queue({ type: 'recall', date: hk(), key: rc.key, ok: b.dataset.ok === '1' });
        };
      }
    };
  $('#cfg').onclick = (e) => {
    e.preventDefault();
    setup();
  };
  if (typing >= 0) {
    cap.focus();
    cap.setSelectionRange(typing, typing);
  } else if (focus || !ready) {
    cap.focus();
    if (!ready) {
      ready = performance.now() - T0;
      $('.status span:nth-child(3)').textContent = `開到能打字 ${Math.round(ready)} ms`;
    }
  }
}

draw(true);
sync();
addEventListener('online', sync);
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && sync());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
